[project]
name = "rodar-tokens"
version = "0.1.0"
description = "Servicio de tokens del gateway del clúster Rodar (OAuth2 client credentials, JWT RS256)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165,<1",
    "uvicorn[standard]>=0.54,<1",
    "pydantic-settings>=2.16,<3",
    "pyjwt[crypto]>=2.10,<3",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "httpx>=0.28,<1",
]

[tool.uv]
package = false
